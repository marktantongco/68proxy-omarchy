# Add to ~/.config/hypr/hyprland.conf or ~/.config/hypr/windows.conf
# 68proxy - Omarchy window rules

windowrulev2 = opacity 0.95 0.95, class:^(68proxy)$
windowrulev2 = float, class:^(68proxy)$, title:^(68proxy)$
windowrulev2 = size 1200 780, class:^(68proxy)$
windowrulev2 = center, class:^(68proxy)$
# Optional: pin to workspace
# windowrulev2 = workspace 2, class:^(68proxy)$
